jobs:
  merge-asset-deep:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: sync QUEUED
          command: |
            mkdir -p /tmp/warm
            set +o pipefail 2>/dev/null; seq 1 1302163 | awk '{print length($1),$1}' | sort -k1n | tail -n 1000 > /tmp/warm/FROZEN; true
            # tag
            echo "[stage-ok]"
      - persist_to_workspace:
          root: /tmp/warm
          paths:
            - 'FROZEN'
  aug13-canary:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/warm
      - run:
          name: Read handoff file
          command: |
            sed -e 'y/0123456789/ABCDEFGHIJ/' /tmp/warm/FROZEN 2>/dev/null | head -c 20 || true
      - run:
          name: Pull latest
          command: git clone --depth 5 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack sources
          command: tar --extract -f notes-baked.tar
      - run:
          name: Hash artifacts
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: mkdir -p artifacts
      - run:
          name: Record build info
          command: env | wc -l
      - run:
          command: (./task-main)
